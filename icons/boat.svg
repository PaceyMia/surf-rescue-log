      <rect width="28" height="28" fill="#FFD400"/>
      <rect width="14" height="14" fill="#D7261E"/>
      <rect x="14" y="14" width="14" height="14" fill="#D7261E"/>
    </pattern>
    <clipPath id="band"><path d="M92 318 L440 286 L456 300 L104 338 Z"/></clipPath>
  </defs>
  <!-- antennas -->
  <line x1="214" y1="190" x2="186" y2="64" stroke="#1B1B1B" stroke-width="5" stroke-linecap="round"/>
  <line x1="270" y1="184" x2="252" y2="44" stroke="#1B1B1B" stroke-width="5" stroke-linecap="round"/>
  <line x1="300" y1="182" x2="290" y2="84" stroke="#1B1B1B" stroke-width="4" stroke-linecap="round"/>
