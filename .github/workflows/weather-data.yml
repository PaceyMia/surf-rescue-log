# Fetches BOM forecasts/warnings and WillyWeather data every 30 minutes and
# publishes weather.json on the `weather-data` branch, which the app reads via
# raw.githubusercontent.com. Keeps the WillyWeather key secret (repo secret
# WW_API_KEY) without needing a server.
name: Weather data

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    paths:
      - data-scripts/fetch_weather.mjs
      - .github/workflows/weather-data.yml

permissions:
  contents: write

concurrency:
  group: weather-data
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download BOM products (anonymous FTP)
        run: |
          mkdir -p bom
          for f in IDN11001.xml IDN11013.xml IDZ00054.warnings_nsw.xml; do
            curl -sS --retry 3 -m 60 -o "bom/$f" "ftp://ftp.bom.gov.au/anon/gen/fwo/$f" || echo "::warning::could not download $f"
          done
      - name: List BOM NSW products (for finding product IDs)
        run: |
          mkdir -p out
          curl -sS -m 60 --list-only "ftp://ftp.bom.gov.au/anon/gen/fwo/" | grep -E '^ID(N|Z)' | sort > out/fwo-index.txt || true
      - name: Build weather.json
        env:
          WW_API_KEY: ${{ secrets.WW_API_KEY }}
          WW_LOCATION_ID: ${{ vars.WW_LOCATION_ID }}
        run: node data-scripts/fetch_weather.mjs out bom
      - name: Publish to weather-data branch
        run: |
          cd out
          git init -q -b weather-data
          git config user.name "weather-data bot"
          git config user.email "actions@users.noreply.github.com"
          git add weather.json fwo-index.txt
          git commit -q -m "Weather data $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" weather-data
